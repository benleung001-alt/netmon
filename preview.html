<body>
<h2>NetMon 设备清单 · 电脑端预览</h2>
<div class="sub">把路由器上的 <code>/tmp/dhcp.leases</code> 内容粘进来，即可在电脑上预览带 hostname / 厂商 / 随机MAC 标记的设备清单（无需登录路由器）。</div>

<div class="panel">
  <label style="font-size:13px;color:#555;">粘贴 dhcp.leases 内容（每行：到期时间戳 MAC IP 主机名 客户端ID）：</label>
  <textarea id="input" placeholder="1761436800 9a:21:6a:12:19:2b 192.168.1.101 iPhone *"></textarea>
  <div class="btns">
    <button onclick="loadSample()">加载示例</button>
    <button class="sec" onclick="parseInput()">解析</button>
    <button class="ghost" onclick="document.getElementById('input').value='';document.getElementById('out').innerHTML='';">清空</button>
  </div>
  <div class="note">
    在路由器上取数：<code>cat /tmp/dhcp.leases</code>（SSH 登录后），或 LuCI → 网络 → DHCP 租约 页面复制。<br>
    说明：iPhone / 安卓开启「私有地址」后 MAC 为随机值，OUI 查不到厂商，这里会标记<span class="badge b-rand">随机MAC</span>；但 <b>hostname 仍由设备自报，不受随机 MAC 影响</b>。
  </div>
</div>

<div id="out"></div>

function ouiLookup(oui) {
  if (typeof OUI_DB !== "undefined" && OUI_DB[oui]) return OUI_DB[oui];
  if (FALLBACK_OUI[oui]) return FALLBACK_OUI[oui];
  return null;
}

function guessType(host, vendor) {
  var s = ((host || "") + " " + (vendor || "")).toLowerCase();
  if (s.indexOf("iphone") >= 0 || s.indexOf("ipad") >= 0 || s.indexOf("apple") >= 0) return "苹果设备";
  if (s.indexOf("samsung") >= 0 || s.indexOf("galaxy") >= 0) return "三星设备";
  if (s.indexOf("tv") >= 0) return "电视";
  if (s.indexOf("pc") >= 0 || s.indexOf("desktop") >= 0 || s.indexOf("laptop") >= 0 || s.indexOf("macbook") >= 0 || s.indexOf("book") >= 0) return "电脑";
  if (s.indexOf("echo") >= 0 || s.indexOf("alexa") >= 0 || s.indexOf("xiaomi") >= 0 || s.indexOf("mi ") >= 0 || s.indexOf("camera") >= 0 || s.indexOf("cam") >= 0 || s.indexOf("home") >= 0) return "智能家居";
  if (s.indexOf("router") >= 0 || s.indexOf("ap") >= 0 || s.indexOf("tplink") >= 0 || s.indexOf("huawei") >= 0 || s.indexOf("huawai") >= 0) return "网络设备";
  return "其他";
}

function isRandomMac(mac) {
  var oui = mac.replace(/[:\-]/g, "").toUpperCase();
  if (oui.length < 6) return false;
  var c2 = oui.charAt(1);
  return ["2","3","6","7","A","B","E","F"].indexOf(c2) >= 0;
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}

function parseInput() {
  var text = document.getElementById("input").value.trim();
  var lines = text.split(/\r?\n/);
  var devices = [];
  var seenIp = {};
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var p = line.split(/\s+/);
    if (p.length < 4) continue;
    var exp = p[0], mac = p[1], ip = p[2], host = p[3];
    if (host === "*") host = "";
    if (seenIp[ip]) continue; // 简单去重（按 IP）
    seenIp[ip] = true;
    var oui = mac.replace(/[:\-]/g, "").toUpperCase().substr(0, 6);
    var rnd = isRandomMac(mac);
    var vendor = rnd ? "私有地址(随机MAC)" : (ouiLookup(oui) || "未知");
    devices.push({ ip: ip, mac: mac, hostname: host || "未知", vendor: vendor, random_mac: rnd, type: guessType(host, vendor) });
  }
  render(devices);
}

function render(devices) {
  var html = '<div class="panel"><div class="sub">共 <b>' + devices.length + '</b> 台设备（预览数据，来自粘贴的 dhcp.leases）</div>';
  html += '<table><thead><tr><th>#</th><th>主机名</th><th>IP</th><th>MAC</th><th>厂商</th><th>类型</th><th>MAC 属性</th></tr></thead><tbody>';
  if (devices.length === 0) {
    html += '<tr><td colspan="7" style="text-align:center;color:#999;">没有解析到设备，请检查粘贴内容格式。</td></tr>';
  }
  for (var i = 0; i < devices.length; i++) {
    var d = devices[i];
    var cls = d.random_mac ? "b-rand" : "b-real";
    var lbl = d.random_mac ? "随机MAC" : "真实MAC";
    html += '<tr>'
      + '<td>' + (i + 1) + '</td>'
      + '<td>' + escapeHtml(d.hostname) + '</td>'
      + '<td class="mono">' + escapeHtml(d.ip) + '</td>'
      + '<td class="mono">' + escapeHtml(d.mac) + '</td>'
      + '<td>' + escapeHtml(d.vendor) + '</td>'
      + '<td>' + escapeHtml(d.type) + '</td>'
      + '<td><span class="badge ' + cls + '">' + lbl + '</span></td>'
      + '</tr>';
  }
  html += '</tbody></table>';
  if (typeof OUI_DB === "undefined") {
    html += '<div class="note warn">提示：未加载到完整 OUI 库（../mac-lookup/oui-db.js），当前使用内置精简表，厂商识别可能不全。把本文件与 mac-lookup 文件夹放在一起即可启用完整库。</div>';
  }
  html += '</div>';
  document.getElementById("out").innerHTML = html;
}

function loadSample() {
  var sample = [
    "1761436800 9a:21:6a:12:19:2b 192.168.1.101 iPhone *",
    "1761436800 3c:22:fb:11:22:33 192.168.1.102 ben-pc 01:00:00:00:00:00",
    "1761436800 f4:f5:e8:44:55:66 192.168.1.103 Samsung-TV 00:00:00:00:00:00",
    "1761436800 00:1a:2b:77:88:99 192.168.1.104 * 00:00:00:00:00:00",
    "1761436800 a4:cf:12:ab:cd:ef 192.168.1.105 Chromecast 00:00:00:00:00:00"
  ].join("\n");
  document.getElementById("input").value = sample;
  parseInput();
}
